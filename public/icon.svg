<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C96A3C" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#C96A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A05C"/>
      <stop offset="100%" stop-color="#C96A3C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0E0906"/>
  <circle cx="256" cy="256" r="256" fill="url(#glow)"/>

  <!-- Echoes the session timer ring: a faint track with an ember sweep over it. -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#EDE0CE" stroke-opacity=".10" stroke-width="30"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ember)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="660 283" transform="rotate(-90 256 256)"/>

  <circle cx="256" cy="256" r="128" fill="#140D08" fill-opacity=".55"/>
</svg>
